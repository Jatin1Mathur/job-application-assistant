services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobassistant-postgres
    environment:
      POSTGRES_DB: jobassistant
      POSTGRES_USER: jobuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: jobassistant-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
