# Continuous integration: GitHub runs these checks by itself on every push and on every pull request.
# A red cross on a commit or pull request means one of them failed.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless, so it is stopped
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # Some tests start the whole application, so they need a real database and a real cache.
    # GitHub starts these two containers next to the job, on the same ports as docker-compose.yml.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jobassistant
          POSTGRES_USER: jobuser
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobuser -d jobassistant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway values that exist only inside this test run. The real secrets are in nobody's repository.
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # The AI model is not needed: the tests replace Ollama with a stand-in
      - name: Run the tests
        run: ./mvnw -B test

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exactly the versions of package-lock.json
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (includes the TypeScript check)
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The images are only built, to prove that the Dockerfiles work. They are not uploaded anywhere.
      - name: Build the backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: jobassistant-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build the frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: jobassistant-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
