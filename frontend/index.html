<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Assistant</title>
    <meta name="description" content="Check how well your resume fits a job, see which skills are missing, write a cover letter and keep track of every application." />
    <meta name="theme-color" content="#f9f6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13110e" media="(prefers-color-scheme: dark)" />
    <script>
      // Pick light or dark before the page is drawn, so there is no flash of the wrong colors (see src/theme.tsx)
      ;(function () {
        var saved = localStorage.getItem('job-assistant.theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
