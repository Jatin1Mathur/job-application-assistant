spring:
  application:
    name: job-assistant

  # Local secrets live in .env (not committed) - see .env.example
  config:
    import: optional:file:.env[.properties]

  # PostgreSQL container from docker-compose.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/jobassistant
    username: jobuser
    password: ${POSTGRES_PASSWORD}

  # Flyway creates the tables (db/migration); Hibernate only checks they match the entities
  jpa:
    hibernate:
      ddl-auto: validate

  # Redis container from docker-compose.yml (host port 6380, see the comment there)
  data:
    redis:
      host: localhost
      port: 6380

  # Resume uploads: PDFs up to 5 MB (the request itself may be slightly bigger than the file)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# Login tokens (JWT). The secret is read from .env and must never be committed
jwt:
  secret: ${JWT_SECRET}
  # How long a login stays valid
  expiration: 24h

# Local AI model served by Ollama (https://ollama.com)
ai:
  ollama:
    base-url: http://localhost:11434
    model: llama3.2
    # Local models are slow, so wait a long time for the answer
    timeout: 180s

# The shared demo account behind "Try with demo account"
demo:
  # false: no demo account is created and the demo login answers "not available"
  enabled: true
  # When the sample data is put back (Spring cron: second minute hour day month weekday). Here: every night at 03:00
  reset-cron: "0 0 3 * * *"

server:
  port: 8080
  tomcat:
    # Let Tomcat read an oversized upload to the end so the client gets our JSON error, not a dropped connection
    max-swallow-size: -1
